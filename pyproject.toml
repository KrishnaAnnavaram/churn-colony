[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-colony"
version = "0.1.0"
description = "Churn prediction with ant-colony feature selection, boosting and SHAP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
shap = ["shap>=0.45"]
all = ["churn-colony[boost,shap]"]
dev = ["pytest>=8"]

[project.scripts]
churn-colony = "churn_colony.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Could not find the number of physical cores:UserWarning"]
